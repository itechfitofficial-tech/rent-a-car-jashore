<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rent a Car 24-7 Jashore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#101C2C;--blue:#244B73;--orange:#FF8A36;--bg:#F7F8FA;--white:#fff;--text:#202938;--line:#e1e5ec;--mute:#5d6878}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:"Anek Bangla",system-ui,sans-serif;background:#fff;color:var(--text);line-height:1.65;font-size:17px;-webkit-font-smoothing:antialiased}
a{color:inherit}img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
h1,h2,h3{line-height:1.2;font-weight:800;letter-spacing:-.01em;color:var(--navy)}
h1{font-size:clamp(32px,5.4vw,54px)}
h2{font-size:clamp(25px,3.6vw,36px);margin-bottom:10px}
h3{font-size:19px}
.sub{color:var(--mute);max-width:58ch;margin-bottom:28px}
section{padding:60px 0}
.alt{background:var(--bg)}
.btn{display:inline-block;background:var(--orange);color:var(--navy);font:700 16px "Anek Bangla",sans-serif;padding:12px 22px;border:0;border-radius:6px;text-decoration:none;cursor:pointer}
.btn:hover{background:#ff9b52}
.btn.line{background:#fff;border:2px solid var(--navy)}
.btn.line:hover{background:var(--bg)}
.btn.sm{padding:9px 16px;font-size:15px}

header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar{display:flex;align-items:center;justify-content:space-between;height:68px;gap:14px}
.logo{font-weight:800;font-size:19px;text-decoration:none;white-space:nowrap;color:var(--navy)}
.logo b{background:var(--navy);color:#fff;padding:2px 8px;border-radius:5px;margin:0 2px}
@media(max-width:480px){.logo{font-size:15px}.lang button{padding:6px 8px}.bar{gap:8px}}
nav{display:flex;gap:20px;font-size:15px;font-weight:500}
nav a{text-decoration:none;color:var(--text);padding:6px 0;border-bottom:2px solid transparent}
nav a:hover,nav a.on{border-color:var(--orange)}
.tools{display:flex;gap:10px;align-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{background:#fff;border:0;font:600 14px "Anek Bangla",sans-serif;padding:6px 11px;cursor:pointer;color:var(--text)}
.lang button[aria-pressed=true]{background:var(--navy);color:#fff}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:6px;width:40px;height:40px;font-size:20px;cursor:pointer}
@media(max-width:1000px){.burger{display:block}nav{display:none;position:absolute;top:68px;left:0;right:0;background:#fff;flex-direction:column;gap:0;padding:8px 20px 16px;border-bottom:1px solid var(--line)}nav.open{display:flex}nav a{padding:12px 0}.tools .btn{display:none}}

.hero{padding:48px 0 40px}
.hg{display:grid;grid-template-columns:1.05fr 1fr;gap:32px;align-items:center}
@media(max-width:860px){.hg{grid-template-columns:1fr}}
.lead{color:var(--mute);font-size:18px;max-width:50ch;margin:14px 0 24px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.hero img{width:100%;height:auto}
.route{position:relative;display:flex;justify-content:space-between;margin:40px 0 0;max-width:520px}
.route::before{content:"";position:absolute;left:6%;right:6%;top:9px;border-top:3px dashed #c9d0dc}
.stop{position:relative;text-align:center;flex:1;font-size:13px;color:var(--mute)}
.stop i{display:block;width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--blue);margin:0 auto 6px}
.stop.home i{background:var(--orange);border-color:var(--orange)}
.stop strong{display:block;color:var(--navy);font-size:16px}
.stop em{font-style:normal;color:#c25a10;font-weight:600}

.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
@media(max-width:960px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.g4,.g3,.g2{grid-template-columns:1fr}}
.car{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.car .ph{display:block;text-decoration:none;background:var(--bg);aspect-ratio:3/2;overflow:hidden;position:relative}
.car .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.noimg{height:100%;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:14px;border-bottom:1px dashed var(--line)}
.car .in{padding:16px;display:flex;flex-direction:column;flex:1}
.car h3{margin-bottom:2px}
.m{color:var(--mute);font-size:14px;min-height:40px}
.seats{display:flex;gap:3px;flex-wrap:wrap;margin:8px 0}
.seats s{width:8px;height:12px;border-radius:3px 3px 1px 1px;background:var(--blue)}
.price{font-size:22px;font-weight:800;color:var(--navy);margin:6px 0 2px}
.price small{font-size:13px;font-weight:500;color:var(--mute)}
.chips{list-style:none;padding:0;font-size:14px;color:var(--mute);margin:8px 0 14px;flex:1}
.chips li{padding:3px 0;border-top:1px solid var(--line)}
.car .btn{text-align:center}

.tbl{width:100%;border-collapse:collapse;font-size:16px}
.tbl th,.tbl td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:14px;color:var(--mute);font-weight:600;background:var(--bg)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.note{margin-top:14px;font-size:14px;color:var(--mute);max-width:72ch}

.split{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}
@media(max-width:800px){.split{grid-template-columns:1fr}}
.split img{border-radius:10px;width:100%}
.pts{list-style:none;padding:0;margin-top:14px}
.pts li{padding:10px 0 10px 16px;border-left:4px solid var(--orange);margin-bottom:10px;background:var(--bg);border-radius:0 6px 6px 0}
.pts b{display:block;color:var(--navy)}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;counter-reset:s}
@media(max-width:760px){.st{grid-template-columns:1fr}}
.st div{counter-increment:s;border-top:3px solid var(--navy);padding-top:12px}
.st div::before{content:counter(s);display:block;color:var(--orange);font-weight:800;font-size:30px}
.st p{color:var(--mute);font-size:16px}
.band{background:var(--navy);color:#fff;border-radius:12px;padding:36px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.band h2{color:#fff;margin:0}.band p{color:#c3cddb}

.ph1{padding:40px 0 8px}
.crumb{font-size:14px;color:var(--mute);margin-bottom:10px}
.crumb a{text-decoration:none}
form.f{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:820px}
form.f .full{grid-column:1/-1}
@media(max-width:600px){form.f{grid-template-columns:1fr}}
label{font-size:14px;font-weight:600;color:var(--mute);display:block;margin-bottom:4px}
input,select,textarea{width:100%;font:500 16px "Anek Bangla",sans-serif;padding:11px 10px;border:1px solid #c9d0dc;border-radius:6px;background:#fff;color:var(--text)}
textarea{min-height:90px}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode label{border:2px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;color:var(--text);font-weight:500}
.mode label:has(input:checked){border-color:var(--orange);background:#fff6ee}
.mode input{width:auto;margin-right:6px}
.mode small{display:block;color:var(--mute);font-weight:400}
.hint{background:var(--bg);border-left:4px solid var(--blue);padding:10px 14px;border-radius:0 6px 6px 0;font-size:15px}
.err{color:#b3261e;font-size:14px}
.preview{background:#fff6ee;border:1px solid #ffd2ac;border-radius:8px;padding:12px 16px;font-size:14px;margin-bottom:20px;max-width:820px}
.ref{font-size:28px;font-weight:800;color:var(--navy);letter-spacing:.02em}
.dl{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;max-width:620px;margin:18px 0}
.dl dt{color:var(--mute);font-size:15px}.dl dd{font-weight:500;margin:0}
.empty{background:#fff;border:2px dashed var(--line);border-radius:10px;padding:28px;max-width:640px}
.empty p{color:var(--mute);margin:6px 0 0}
details{border:1px solid var(--line);border-radius:8px;padding:15px 18px;margin-bottom:10px;max-width:780px;background:#fff}
summary{font-weight:700;cursor:pointer;color:var(--navy)}
details p{margin-top:8px;color:var(--mute)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:4px 14px;font-size:15px;margin:0 6px 6px 0;background:#fff}
.svc{border:1px solid var(--line);border-radius:10px;padding:20px;background:#fff}
.svc p{color:var(--mute);font-size:15px;margin-top:6px}
.svc .r{margin-top:10px;font-weight:700;color:var(--navy);font-size:15px}
.map{background:var(--bg);border:1px dashed #c9d0dc;border-radius:10px;height:220px;display:flex;align-items:center;justify-content:center;color:var(--mute)}

section.alt+section.alt{padding-top:0}
.trust{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px;margin:22px 0 0;font-size:15px;color:var(--text);font-weight:500}
.trust li::before{content:"\2713";color:var(--orange);font-weight:800;margin-right:6px}
.qs{display:grid;grid-template-columns:1.2fr 1.2fr 1.4fr auto;gap:12px;align-items:end;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 8px 28px rgba(16,28,44,.10)}
@media(max-width:860px){.qs{grid-template-columns:1fr 1fr}.qs .btn{grid-column:1/-1}}
@media(max-width:520px){.qs{grid-template-columns:1fr}}
.rc{border:1px solid var(--line);border-radius:10px;padding:18px;background:#fff;display:flex;flex-direction:column;gap:2px}
.rl{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--navy);font-size:18px}
.rl i{flex:1;border-top:3px dashed #c9d0dc}
.rc .pr{font-size:15px;color:var(--mute);margin:6px 0 0}.rc .pr b{color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px}
.gp{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}
.gp button{border:2px solid var(--line);background:#fff;border-radius:8px;padding:9px 16px;font:600 16px "Anek Bangla",sans-serif;cursor:pointer;color:var(--text)}
.gp button[aria-pressed=true]{border-color:var(--orange);background:#fff6ee}
.pk{flex-direction:row}.pk .ph{width:40%;aspect-ratio:auto;min-height:150px;flex:none}
.opt{border-top:4px solid var(--orange);background:var(--bg);padding:18px;border-radius:0 0 8px 8px}.opt p{color:var(--mute);font-size:16px;margin-top:6px}
.uc{display:block;text-decoration:none;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.uc img{width:100%;aspect-ratio:3/2;object-fit:cover}.uc div{padding:16px}.uc p{color:var(--mute);font-size:15px;margin-top:4px}
footer{background:var(--navy);color:#c3cddb;padding:44px 0 96px;font-size:15px}
.fg{display:grid;grid-template-columns:2fr 1fr 1fr;gap:28px}
@media(max-width:700px){.fg{grid-template-columns:1fr}}
footer h3{color:#fff;font-size:17px;margin-bottom:8px}
footer a{display:block;text-decoration:none;padding:2px 0}
.copy{margin-top:24px;padding-top:14px;border-top:1px solid rgba(255,255,255,.15);font-size:13px}
.sticky{position:fixed;bottom:0;left:0;right:0;background:var(--orange);display:none;z-index:30}
.sticky a{display:block;text-align:center;padding:14px;font-weight:800;color:var(--navy);text-decoration:none}
@media(max-width:1000px){.sticky{display:block}}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 18px;border-radius:8px;font-size:15px;max-width:90%;z-index:40;display:none}
</style>
</head>

let lang='bn',last=null,cur=(location.hash||'').replace(/^#\/?/,'');
const L=(b,e)=>lang==='bn'?b:e;
const fmt=n=>Number(n).toLocaleString(lang==='bn'?'bn-BD':'en-US');
const rng=a=>'৳'+fmt(a[0])+'–'+fmt(a[1]);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PHONE='01XXX-XXXXXX';

const CARS=[
 {id:'sedan',img:'civic',s:[4,4],bn:'সেডান',en:'Sedan',models:'Axio, Allion, Premio, X Corolla',body:[2000,4000],km:[15,17],full:[2500,4000],min:2,stay:false},
 {id:'noah',img:'noah1',s:[7,7],bn:'মাইক্রোবাস',en:'Microbus',models:'Noah, Esquire, Voxy, X Noah',body:[2500,5000],km:[18,23],full:[3500,5500],min:1,stay:true},
 {id:'hiace',img:'hiace',s:[10,12],bn:'হাইএস',en:'HiAce',models:'Toyota HiAce 2012–2022',body:[3500,5500],km:[18,23],full:[4000,5500],min:1,stay:true},
 {id:'cabin',img:'cabin',s:[15,18],bn:'গ্র্যান্ড কেবিন',en:'Grand Cabin',models:'Toyota / Nissan Grand Cabin',body:[5000,7500],km:[22,30],full:[5500,7500],min:1,stay:true}

 ['যশোর','Jashore','ঢাকা','Dhaka',[8500,13000],[8500,13000]],
 ['ঢাকা','Dhaka','খুলনা','Khulna',[7500,13000],[7500,13000]]

const sl=c=>c.s[0]===c.s[1]?fmt(c.s[0]):fmt(c.s[0])+'–'+fmt(c.s[1]);
const dots=n=>'<div class="seats" aria-hidden="true">'+'<s></s>'.repeat(n)+'</div>';
const photo=(c,alt)=>c.img?`<img src="${IMG[c.img]}" alt="${esc(alt)}" loading="lazy">`:`<div class="noimg">${L('ছবি যুক্ত হবে','Photo to be added')}</div>`;

function carCard(c){
 const nm=L(c.bn,c.en);
 return `<article class="car"><a class="ph" href="#/vehicle/${c.id}" aria-label="${esc(nm)}">${photo(c,nm)}</a><div class="in">
 <h3>${nm}, ${sl(c)} ${L('সিট','seats')}</h3><p class="m">${c.models}</p>${dots(c.s[1])}
 <div class="price">${rng(c.body)} <small>${L('প্রতিদিন','per day')}</small></div>
 <ul class="chips"><li>${L('কিমি প্রতি','Per km')} ${rng(c.km)}</li><li>${c.stay?L('ড্রাইভারের থাকা, খাওয়া, পার্কিং অন্তর্ভুক্ত','Driver stay, food, parking included'):L('কমপক্ষে ২ দিন','Minimum 2 days')}</li><li>${L('অথবা ফুল ট্যাংক জ্বালানি','Or full tank fuel')}</li></ul>
 <a class="btn sm" href="#/booking?car=${c.id}">${L('বুক করুন','Book')}</a></div></article>`;
}
function routeTable(){
 return `<div class="scroll"><table class="tbl"><thead><tr><th>${L('রুট','Route')}</th><th>${L('ড্রপ','Drop')}</th><th>${L('আপ-ডাউন','Up-down')}</th></tr></thead><tbody>`+
 ROUTES.map(r=>`<tr><td>${L(r[0],r[1])} → ${L(r[2],r[3])}</td><td><b>${rng(r[4])}</b></td><td><b>${rng(r[5])}</b></td></tr>`).join('')+`</tbody></table></div>`;
}

function estOut(id,d){const c=car(id);let n=Math.round(+d)||c.min,note='';if(n<c.min){n=c.min;note=L(' (কমপক্ষে '+fmt(c.min)+' দিন)',' (minimum '+c.min+' days)')}n=Math.min(30,n);
 return `<b style="font-size:22px;color:var(--navy)">${rng([c.body[0]*n,c.body[1]*n])}</b><br>${L('বডি রেন্ট, ','Body rent, ')}${fmt(n)} ${L('দিন','day(s)')}${note}<br>${L('জ্বালানি আলাদা: কিমি প্রতি ','Fuel extra: per km ')}${rng(c.km)}${L(', অথবা ফুল ট্যাংক ফেরত দিন। চূড়ান্ত রেট নিশ্চিতের সময় জানানো হবে।',', or return with a full tank. The final rate is confirmed by our team.')}`}

/* ---------- shell ---------- */
function shell(route,body){
 return `<header><div class="wrap bar"><a class="logo" href="#/">Rent a Car <b>24-7</b> Jashore</a>
 <nav id="nav" aria-label="Main">${NAV.map(n=>`<a href="#/${n[0]}" class="${route===n[0]?'on':''}">${L(n[1],n[2])}</a>`).join('')}</nav>
 <div class="tools"><a class="btn sm" href="#/booking">${L('বুক করুন','Book now')}</a><div class="lang" role="group" aria-label="Language"><button type="button" data-l="bn" aria-pressed="${lang==='bn'}">বাংলা</button><button type="button" data-l="en" aria-pressed="${lang==='en'}">EN</button></div><button class="burger" id="bg" aria-label="Menu" aria-expanded="false">☰</button></div></div></header>
 <main>${body}</main>
 <footer><div class="wrap fg"><div><h3>Rent a Car 24-7 Jashore</h3><p>${L('যশোরভিত্তিক কার রেন্টাল, সেবা এলাকা ঢাকা, খুলনা ও সাতক্ষীরা। ২৪ ঘণ্টা খোলা।','Car rental in Jashore, serving Dhaka, Khulna and Satkhira. Open 24 hours.')}</p></div>
 <div><h3>${L('পেজ','Pages')}</h3>${NAV.slice(0,4).map(n=>`<a href="#/${n[0]}">${L(n[1],n[2])}</a>`).join('')}</div>
 <div><h3>${L('যোগাযোগ','Contact')}</h3><a href="tel:+8801XXXXXXXXX">${PHONE}</a><a href="#/booking">${L('অনলাইনে বুক করুন','Book online')}</a><a href="#/faq">${L('প্রশ্নোত্তর','FAQ')}</a></div></div>
 <div class="wrap copy">${L('ডিজাইন প্রিভিউ। ফোন, ঠিকানা ও ছবি নমুনা।','Design preview. Phone, address and photos are placeholders.')}</div></footer>
 <div class="sticky"><a href="tel:+8801XXXXXXXXX">${L('এখনই কল করুন','Call now')}: ${PHONE}</a></div>`;
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}
const PREV=()=>L('এটি ডিজাইন প্রিভিউ। পরের ধাপে সিস্টেমের সাথে যুক্ত হবে।','Design preview only. This connects to the system in the next phase.');

function render(keepScroll){
 const [path,qs]=(cur||'home').split('?');
 const [page,arg]=path.split('/');
 const q=new URLSearchParams(qs||'');
 const route=PAGES[page]?page:'home';
 const body=route==='vehicle'?PAGES.vehicle(arg):PAGES[route](q);
 document.getElementById('app').innerHTML=shell(route==='vehicle'?'vehicles':route,body);
 document.documentElement.lang=lang;
 document.title='Rent a Car 24-7 Jashore';
 if(!keepScroll)window.scrollTo(0,0);
 bind(route);
}
function bind(route){
 document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;render(true)});
 const bg=document.getElementById('bg'),nav=document.getElementById('nav');
 bg.onclick=()=>{const o=nav.classList.toggle('open');bg.setAttribute('aria-expanded',o)};
 nav.onclick=e=>{if(e.target.tagName==='A')nav.classList.remove('open')};
 if(route==='booking'){
  const v=document.getElementById('v'),h=document.getElementById('hint');
  const upd=()=>{const c=CARS.find(x=>x.id===v.value);h.textContent=L('রেট: ','Rate: ')+rng(c.body)+L(' প্রতিদিন, কিমি ',' per day, per km ')+rng(c.km)+(c.min>1?L(' (কমপক্ষে ২ দিন)',' (minimum 2 days)'):'')+L('. চূড়ান্ত রেট নিশ্চিতের সময় জানানো হবে।','. Final rate confirmed by our team.')};
  v.onchange=upd;upd();
  document.getElementById('bf').onsubmit=e=>{
   e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f)),er=document.getElementById('err');
   if(!d.n.trim()||!/^[0-9+\-\s]{8,16}$/.test(d.ph.trim())||!d.pu.trim()||!d.ds.trim()||!d.d1||!d.d2){er.textContent=L('নাম, সঠিক ফোন নম্বর, রুট ও দুই তারিখ দিন।','Enter your name, a valid phone number, route and both dates.');return}
   if(d.d2<=d.d1){er.textContent=L('ফেরার সময় যাওয়ার সময়ের পরে হতে হবে।','Return time must be after pickup time.');return}
   last=d;go('confirmation');
  };
 }
 if(route==='home'){
  const pk=document.getElementById('pk'),ev=document.getElementById('ev'),ed=document.getElementById('ed'),eo=document.getElementById('eo');
  document.querySelectorAll('.gp button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.gp button').forEach(x=>x.setAttribute('aria-pressed',x===b));pk.innerHTML=pickCard(b.dataset.c)});
  const upd=()=>{eo.innerHTML=estOut(ev.value,ed.value)};ev.onchange=upd;ed.oninput=upd;upd();
  document.getElementById('qs').onsubmit=e=>{e.preventDefault();const f=e.target,p=new URLSearchParams({car:f.qv.value,to:f.qt.value});if(f.qd.value)p.set('d1',f.qd.value);go('booking?'+p.toString())};
 }
 ['rf','cf'].forEach(id=>{const f=document.getElementById(id);if(f)f.onsubmit=e=>{e.preventDefault();toast(PREV())}});
}
function go(r){cur=r;try{history.replaceState(null,'','#/'+r)}catch(e){}render(false);document.documentElement.scrollTop=0}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#/"]');if(!a)return;e.preventDefault();go(a.getAttribute('href').slice(2))});
window.addEventListener('hashchange',()=>{cur=location.hash.replace(/^#\/?/,'');render(false)});
render(false);
</script>
</body>
</html>
